server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker'ın internal DNS resolver'ı — hostname'leri runtime'da çözer
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — variable kullanınca Nginx startup'ta değil, istek gelince çözüyor
    location /api {
        set $backend http://orderly-app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads {
        set $backend http://orderly-app:8080;
        proxy_pass $backend;
    }
}
